name: Weekly data refresh

# Refreshes the research data from upstream sources, recomputes the full
# analytical pipeline, validates it, and commits only when the regenerated
# outputs actually changed. A push to main is what triggers the existing
# Netlify Git integration to rebuild and redeploy the site.
#
# Off-peak slot: Wednesdays 06:47 UTC (02:47 US Eastern), well after Tuesday's
# US close is final and before the next session opens.

on:
  schedule:
    - cron: "47 6 * * 3"
  workflow_dispatch:

# One refresh at a time: overlapping runs would race on the same branch.
concurrency:
  group: weekly-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    # Pinned rather than ubuntu-latest: the research environment must not shift
    # underneath the pipeline, and Python 3.9 images exist for 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history so a rebase retry is possible if main moved mid-run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the local research environment that produced the committed
          # baseline; research/requirements.txt is pinned for this interpreter.
          python-version: "3.9"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Record the pre-refresh data boundary
        id: before
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("data/data-coverage.json")
          through = json.loads(p.read_text())["marketDataThrough"] if p.exists() else "none"
          print(f"through={through}")
          PY

      # --force-download is mandatory here. Without it the loader would reuse
      # the committed cache and the run would republish stale numbers as current.
      - name: Refresh data and regenerate all analytics
        run: python research/generate_outputs.py --force-download

      - name: Numerical sanity audit
        run: python scripts/sanity_audit.py

      - name: Verify the refresh is genuinely fresh
        id: coverage
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, pathlib, sys

          cov = json.loads(pathlib.Path("data/data-coverage.json").read_text())
          through = cov["marketDataThrough"]
          age = (datetime.date.today() - datetime.date.fromisoformat(through)).days
          # A successful download that still lands far in the past means the
          # upstream feed is broken or serving a truncated history. Fail loudly
          # rather than publish it as the current picture.
          if age > 7:
              sys.exit(
                  f"Market data ends {through}, {age} days old. Refusing to "
                  "publish a stale refresh as current."
              )
          print(f"through={through}")
          for s in cov["sources"]:
              print(f"  {s['label']}: through {s['throughLabel']}", file=sys.stderr)
          PY

      - name: Production frontend build
        # Also the integration check that the regenerated JSON is exactly what
        # the site imports: a malformed or missing data file fails the build.
        run: npm run build

      - name: Inspect the resulting diff
        id: diff
        run: |
          set -euo pipefail
          # Only generated research artifacts are ever staged. Build output,
          # node_modules, the Python venv and any local .env are excluded both
          # by .gitignore and by scoping the add to data/.
          git add -A -- data

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No tracked output changed; nothing to commit."
            exit 0
          fi

          CHANGED=$(git diff --cached --name-only)
          echo "Changed files:"
          echo "$CHANGED"

          # validation-summary.json carries a wall-clock generatedAt stamp that
          # moves on every run. If that stamp is the only difference in the whole
          # tree, the refresh found no new data and must not produce a commit.
          OTHER=$(echo "$CHANGED" | grep -v '^data/validation-summary\.json$' || true)
          if [ -z "$OTHER" ]; then
            BEFORE=$(git show HEAD:data/validation-summary.json | sed -E 's/"generatedAt":"[^"]*"//')
            AFTER=$(sed -E 's/"generatedAt":"[^"]*"//' data/validation-summary.json)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Only the generation timestamp moved; skipping no-op commit."
              git reset --quiet
              git checkout -- data
              exit 0
            fi
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --stat

      - name: Commit and push the refreshed research outputs
        if: steps.diff.outputs.changed == 'true'
        env:
          THROUGH: ${{ steps.coverage.outputs.through }}
          BEFORE: ${{ steps.before.outputs.through }}
        run: |
          set -euo pipefail
          # Repository-owner identity, so maintenance commits attribute to the
          # GitHub account that owns the project. Override via repository secret
          # if the account's commit email ever changes.
          git config user.name "${{ secrets.GIT_COMMIT_NAME || 'Vatsal Maniar' }}"
          git config user.email "${{ secrets.GIT_COMMIT_EMAIL || '90730161+VM25@users.noreply.github.com' }}"

          # Message states the market-data boundary this refresh represents,
          # not the workflow run date. No co-author or bot trailers.
          git commit --no-verify -m "data: refresh portfolio research through ${THROUGH}"

          echo "Committed refresh: ${BEFORE} -> ${THROUGH}"

          # main may have moved while the pipeline ran; rebase and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Weekly data refresh"
            echo ""
            echo "- Previous boundary: \`${{ steps.before.outputs.through }}\`"
            echo "- Refreshed boundary: \`${{ steps.coverage.outputs.through }}\`"
            echo "- Committed: \`${{ steps.diff.outputs.changed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
